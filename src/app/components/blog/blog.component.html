<div class="blogs-main">
  <h1 class="fw-bold text-center mt-5 mb-4 text-primary-light">Blogs</h1>
  <div class="container-fluid mt-2 px-4 px-md-5">
    <div class="row justify-content-center">
      @if(blogsList.length){ @for (blog of blogsList; track $index) {
      <div class="col-12 mb-5">
        <div class="container-fluid border-primary rounded-4 p-4">
          <div class="row justify-content-center">
            <div
              class="px-4 d-flex flex-column"
              [ngClass]="
                blog.mainImage
                  ? 'col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4 justify-content-center'
                  : 'col-12'
              "
            >
              <h2 class="fs-1 text-primary fw-bold mb-4">
                {{ blog.mainTitle }}
              </h2>
              <p class="text-secondary mb-5 mb-lg-0 fs-5">
                {{ blog.mainContent | truncate : 200 : true }}
              </p>
              <p
                class="text-primary cursor-pointer mb-5 mb-lg-0 fs-5 mt-2"
                (click)="viewBlogDetails(blog)"
              >
                Read more..
              </p>
            </div>
            @if(blog.mainImage){
            <div
              class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4 px-4 d-flex flex-column justify-content-center"
            >
              <img class="mt-4" [src]="blog.mainImage" alt="" />
            </div>
            }
          </div>
        </div>
      </div>
      } }
    </div>
  </div>
</div>
